<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oramics Machine: drawing sound</title>
  <meta name="description" content="An interactive recreation of Daphne Oram's Oramics machine — draw on a canvas to compose sound directly in your browser.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --text: #1a1a1a;
      --bg: #ffffff;
      --accent-hover: #333;

      /* Channel palette — inky, considered, anchored to the blog's navy */
      --ch-pitch:  #1E2FA8;   /* deep indigo — home color */
      --ch-pitch2: #B8223A;   /* pressroom crimson */
      --ch-amp:    #1A7A6E;   /* teal-green */
      --ch-mod:    #A0471F;   /* burnt sienna */
      --ch-timbre: #5C4FA3;   /* slate violet */
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1.5em;
      max-width: 860px;
      margin: 0 auto;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: .04em;
      margin-bottom: 0.25em;
    }
    .subtitle {
      font-size: 0.78rem;
      opacity: 0.55;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 1.25em;
    }

    /* ── LAB SECTION ── */
    .lab-section {
      border: 1px solid var(--text);
      padding: 0.85em;
    }

    /* ── STATUS BAR ── */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.6em;
      min-height: 18px;
    }
    .status-note {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: var(--text);
      opacity: 0;
      transition: opacity 0.15s;
    }
    .status-note.visible { opacity: 1; }
    .status-mode {
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text);
      opacity: 0.45;
    }

    /* ── CHANNEL LEGEND ── */
    .channel-legend {
      display: flex;
      flex-wrap: nowrap;
      gap: 4px;
      margin-bottom: 0.6em;
      align-items: center;
      overflow-x: auto;
    }
    .channel-legend-label {
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text);
      opacity: 0.5;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .ch-swatch {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: 'Inter', sans-serif;
      font-size: 0.68rem;
      color: var(--text);
      cursor: pointer;
      padding: 3px 7px 3px 6px;
      border: 1px solid transparent;
      transition: border-color 0.12s;
      user-select: none;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .ch-swatch.active { border-color: var(--text); }
    .ch-swatch:hover { border-color: var(--accent-hover); }
    .ch-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── CANVAS ── */
    .canvas-outer {
      display: flex;
      align-items: stretch;
      gap: 5px;
      margin-bottom: 0.7em;
    }
    .y-axis {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2px 0;
      flex-shrink: 0;
    }
    .y-axis span {
      font-size: 0.58rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text);
      opacity: 0.4;
    }
    .canvas-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .canvas-wrap {
      position: relative;
      width: 100%;
      border: 1px solid var(--text);
      background: #fff;
      overflow: hidden;
      cursor: crosshair;
      flex: 1;
    }
    #oram-canvas {
      display: block;
      width: 100%;
      height: 280px;
      touch-action: none;
    }
    #scan-line {
      position: absolute;
      top: 0; bottom: 0;
      width: 2px;
      background: rgba(255, 90, 20, 0.75);
      pointer-events: none;
      box-shadow: 0 0 8px rgba(255, 90, 20, 0.45);
      left: -4px;
      display: none;
    }
    .x-axis {
      display: flex;
      justify-content: space-between;
      padding: 2px 0 0;
    }
    .x-axis span {
      font-size: 0.58rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text);
      opacity: 0.4;
    }

    /* ── TOOLBARS ── */
    .toolbar-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 0.5em;
      flex-wrap: nowrap;
      width: 100%;
    }
    .toolbar-row:last-child { margin-bottom: 0; }

    .oram-btn {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      background: transparent;
      color: var(--text);
      border: 2px solid var(--text);
      padding: 0.32em 0.85em;
      cursor: pointer;
      border-radius: 0;
      white-space: nowrap;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
    }
    .oram-btn:hover { background: var(--accent-hover); color: var(--bg); border-color: var(--accent-hover); }
    .oram-btn.active { background: var(--text); color: var(--bg); }
    .oram-btn.active:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .oram-btn.ghost { border-width: 1px; font-size: 0.72rem; padding: 0.28em 0.7em; }

    .toolbar-sep {
      width: 1px;
      height: 22px;
      background: var(--text);
      opacity: 0.2;
      flex-shrink: 0;
    }

    /* ── SLIDERS ── */
    .slider-ctrl {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }
    .slider-ctrl label {
      font-size: 0.63rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--text);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .slider-ctrl input[type=range] {
      flex: 1;
      min-width: 0;
      -webkit-appearance: none;
      appearance: none;
      height: 2px;
      background: var(--text);
      outline: none;
      cursor: pointer;
    }
    .slider-ctrl input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--text);
      cursor: pointer;
    }
    .slider-ctrl input[type=range]::-moz-range-thumb {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--text);
      border: none;
      cursor: pointer;
    }
    .slider-val {
      font-size: 0.7rem;
      color: var(--text);
      min-width: 28px;
      text-align: right;
      flex-shrink: 0;
    }

    /* ── PRESET ROW ── */
    .preset-row {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-top: 0.6em;
      padding-top: 0.6em;
      border-top: 1px solid rgba(0,0,0,0.12);
    }
    .preset-label {
      font-size: 0.62rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--text);
      opacity: 0.5;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    /* ── MOBILE ── */
    @media (max-width: 600px) {
      body { padding: 0.75em; }

      #oram-canvas { height: 200px; }

      /* Horizontal scan on mobile */
      #scan-line {
        width: 100%;
        height: 2px;
        left: 0; right: 0;
        top: -4px; bottom: auto;
      }

      .oram-btn { font-size: 0.72rem; padding: 0.3em 0.6em; }
      .oram-btn.ghost { font-size: 0.68rem; padding: 0.25em 0.55em; }
      .toolbar-sep { height: 18px; }
      .preset-row { display: none; }
    }
  </style>
</head>
<body>

<h1>Oramics Machine</h1>
<p class="subtitle">draw sound · Daphne Oram, 1962</p>

<div class="lab-section">

  <!-- Status bar -->
  <div class="status-bar">
    <span class="status-note" id="status-note"></span>
    <span class="status-mode" id="waveform-label">sawtooth</span>
  </div>

  <!-- Channel selector -->
  <div class="channel-legend">
    <span class="channel-legend-label">draw →</span>
    <button class="ch-swatch active" data-ch="pitch"  title="Pitch voice 1 — vertical = frequency">
      <span class="ch-dot" style="background:var(--ch-pitch)"></span>pitch 1
    </button>
    <button class="ch-swatch" data-ch="pitch2" title="Pitch voice 2 — independent oscillator">
      <span class="ch-dot" style="background:var(--ch-pitch2)"></span>pitch 2
    </button>
    <button class="ch-swatch" data-ch="amp"    title="Amplitude — vertical = volume">
      <span class="ch-dot" style="background:var(--ch-amp)"></span>amp
    </button>
    <button class="ch-swatch" data-ch="mod"    title="Modulation — vertical = vibrato depth">
      <span class="ch-dot" style="background:var(--ch-mod)"></span>mod
    </button>
    <button class="ch-swatch" data-ch="timbre" title="Timbre — vertical = filter brightness">
      <span class="ch-dot" style="background:var(--ch-timbre)"></span>timbre
    </button>
  </div>

  <!-- Canvas -->
  <div class="canvas-outer">
    <div class="y-axis">
      <span>high</span>
      <span>low</span>
    </div>
    <div class="canvas-col">
      <div class="canvas-wrap">
        <canvas id="oram-canvas"></canvas>
        <div id="scan-line"></div>
      </div>
      <div class="x-axis">
        <span>start</span>
        <span>→ time →</span>
        <span>end</span>
      </div>
    </div>
  </div>

  <!-- Row 1: play + pen tools + undo/clear -->
  <div class="toolbar-row">
    <button class="oram-btn" id="btn-play">▶&#xFE0E; play</button>
    <div class="toolbar-sep"></div>
    <button class="oram-btn active" id="btn-round">round</button>
    <button class="oram-btn"        id="btn-cal">nib</button>
    <button class="oram-btn"        id="btn-eraser">erase</button>
    <div class="toolbar-sep"></div>
    <button class="oram-btn ghost"  id="btn-undo">undo</button>
    <button class="oram-btn ghost"  id="btn-clear">clear</button>
  </div>

  <!-- Row 2: waveform + voice mix slider -->
  <div class="toolbar-row">
    <button class="oram-btn ghost" id="btn-wave" title="Cycle waveform: sawtooth → square → triangle → sine">wave: saw</button>
    <div class="toolbar-sep"></div>
    <div class="slider-ctrl">
      <label for="mix-slider">v2 mix</label>
      <input type="range" id="mix-slider" min="0" max="100" value="70" step="1">
      <span class="slider-val" id="mix-val">70%</span>
    </div>
  </div>

  <!-- Row 3: loop + size sliders -->
  <div class="toolbar-row">
    <div class="slider-ctrl">
      <label for="tempo-slider">loop</label>
      <input type="range" id="tempo-slider" min="3" max="20" value="8" step="1">
      <span class="slider-val" id="tempo-val">8s</span>
    </div>
    <div class="toolbar-sep"></div>
    <div class="slider-ctrl">
      <label for="size-slider">size</label>
      <input type="range" id="size-slider" min="2" max="24" value="8" step="1">
      <span class="slider-val" id="size-val">8</span>
    </div>
  </div>

  <!-- Presets (desktop only) -->
  <div class="preset-row">
    <span class="preset-label">try →</span>
    <button class="oram-btn ghost" data-preset="rise">rising phrase</button>
    <button class="oram-btn ghost" data-preset="wave">slow wave</button>
    <button class="oram-btn ghost" data-preset="rhythm">rhythm</button>
    <button class="oram-btn ghost" data-preset="drone">drone + mod</button>
  </div>

</div>

<script>
(function () {
  'use strict';

  // ── DOM ───────────────────────────────────────────────────
  const canvas      = document.getElementById('oram-canvas');
  const ctx         = canvas.getContext('2d');
  const scanLine    = document.getElementById('scan-line');
  const btnPlay     = document.getElementById('btn-play');
  const btnRound    = document.getElementById('btn-round');
  const btnCal      = document.getElementById('btn-cal');
  const btnEraser   = document.getElementById('btn-eraser');
  const btnUndo     = document.getElementById('btn-undo');
  const btnClear    = document.getElementById('btn-clear');
  const btnWave     = document.getElementById('btn-wave');
  const tempoSlider = document.getElementById('tempo-slider');
  const tempoVal    = document.getElementById('tempo-val');
  const sizeSlider  = document.getElementById('size-slider');
  const sizeVal     = document.getElementById('size-val');
  const mixSlider   = document.getElementById('mix-slider');
  const mixVal      = document.getElementById('mix-val');
  const chSwatches  = document.querySelectorAll('.ch-swatch');
  const statusNote  = document.getElementById('status-note');
  const waveformLabel = document.getElementById('waveform-label');

  // ── Channel colors — MUST match CSS vars exactly ──────────
  const CHANNELS = {
    pitch:  '#1E2FA8',
    pitch2: '#B8223A',
    amp:    '#1A7A6E',
    mod:    '#A0471F',
    timbre: '#5C4FA3',
  };

  // RGB for pixel sampling — derived from same hex values
  const CH_RGB = {
    pitch:  [ 30,  47, 168],
    pitch2: [184,  34,  58],
    amp:    [ 26, 122, 110],
    mod:    [160,  71,  31],
    timbre: [ 92,  79, 163],
  };

  // ── State ─────────────────────────────────────────────────
  let activeChannel = 'pitch';
  let activeTool    = 'round';
  let penSize       = 8;
  let loopSecs      = 8;
  let isPlaying     = false;
  let isDrawing     = false;
  let lastX = 0, lastY = 0;
  let voice2Mix     = 0.7;

  const WAVEFORMS = ['sawtooth','square','triangle','sine'];
  const WAVE_LABELS = ['saw','sqr','tri','sin'];
  let waveIdx = 0;

  // Note name for status display
  const NOTE_NAMES = ['A','A#','B','C','C#','D','D#','E','F','F#','G','G#'];
  function freqToNote(freq) {
    const s = Math.round(12 * Math.log2(freq / 440));
    return NOTE_NAMES[((s % 12) + 12) % 12] + (Math.floor(s / 12) + 4);
  }

  // ── Status ────────────────────────────────────────────────
  let statusTimer;
  function showStatus(msg) {
    statusNote.textContent = msg;
    statusNote.classList.add('visible');
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => statusNote.classList.remove('visible'), 2000);
  }

  // ── Canvas sizing ─────────────────────────────────────────
  function isMobile() { return window.innerWidth <= 600; }

  function resizeCanvas() {
    const wrap = canvas.parentElement;
    const W = wrap.clientWidth;
    const H = isMobile() ? 200 : 280;
    if (canvas.width === W && canvas.height === H) return;
    const saved = canvas.width > 0 ? ctx.getImageData(0, 0, canvas.width, canvas.height) : null;
    canvas.width  = W;
    canvas.height = H;
    canvas.style.height = H + 'px';
    if (saved) ctx.putImageData(saved, 0, 0);
  }

  window.addEventListener('resize', () => { resizeCanvas(); updateScanOrientation(); });
  resizeCanvas();

  // ── Undo ─────────────────────────────────────────────────
  const undoStack = [];
  const MAX_UNDO  = 30;

  function saveUndo() {
    undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    if (undoStack.length > MAX_UNDO) undoStack.shift();
  }

  btnUndo.addEventListener('click', () => {
    if (!undoStack.length) return;
    ctx.putImageData(undoStack.pop(), 0, 0);
  });

  btnClear.addEventListener('click', () => {
    saveUndo();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    showStatus('canvas cleared');
  });

  // ── Drawing ───────────────────────────────────────────────
  function getPos(e) {
    const rect  = canvas.getBoundingClientRect();
    const scaleX = canvas.width  / rect.width;
    const scaleY = canvas.height / rect.height;
    const src = e.touches ? e.touches[0] : e;
    return {
      x: (src.clientX - rect.left) * scaleX,
      y: (src.clientY - rect.top)  * scaleY,
    };
  }

  function drawStroke(x1, y1, x2, y2) {
    ctx.save();
    if (activeTool === 'eraser') {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.lineCap   = 'round';
      ctx.lineJoin  = 'round';
      ctx.lineWidth = penSize * 3;
      ctx.strokeStyle = 'rgba(0,0,0,1)';
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    } else if (activeTool === 'round') {
      ctx.globalCompositeOperation = 'source-over';
      ctx.beginPath();
      ctx.lineCap   = 'round';
      ctx.lineJoin  = 'round';
      ctx.lineWidth = penSize;
      ctx.strokeStyle = CHANNELS[activeChannel];
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    } else {
      // Calligraphy nib — 45° ellipse stamp along path
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = CHANNELS[activeChannel];
      const dist  = Math.hypot(x2 - x1, y2 - y1);
      const steps = Math.max(1, Math.ceil(dist));
      for (let i = 0; i <= steps; i++) {
        const t  = i / steps;
        const px = x1 + (x2 - x1) * t;
        const py = y1 + (y2 - y1) * t;
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(-Math.PI / 4);
        ctx.beginPath();
        ctx.ellipse(0, 0, penSize * 0.35, penSize * 1.2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }
    ctx.restore();
  }

  function onStart(e) {
    e.preventDefault();
    saveUndo();
    isDrawing = true;
    const { x, y } = getPos(e);
    lastX = x; lastY = y;
    drawStroke(x, y, x, y);
  }
  function onMove(e) {
    e.preventDefault();
    if (!isDrawing) return;
    const { x, y } = getPos(e);
    drawStroke(lastX, lastY, x, y);
    lastX = x; lastY = y;
  }
  function onEnd(e) { e.preventDefault(); isDrawing = false; }

  canvas.addEventListener('mousedown',  onStart);
  canvas.addEventListener('mousemove',  onMove);
  canvas.addEventListener('mouseup',    onEnd);
  canvas.addEventListener('mouseleave', onEnd);
  canvas.addEventListener('touchstart', onStart, { passive: false });
  canvas.addEventListener('touchmove',  onMove,  { passive: false });
  canvas.addEventListener('touchend',   onEnd,   { passive: false });

  // ── Tool buttons ──────────────────────────────────────────
  function setTool(t) {
    activeTool = t;
    btnRound .classList.toggle('active', t === 'round');
    btnCal   .classList.toggle('active', t === 'cal');
    btnEraser.classList.toggle('active', t === 'eraser');
  }
  btnRound .addEventListener('click', () => setTool('round'));
  btnCal   .addEventListener('click', () => setTool('cal'));
  btnEraser.addEventListener('click', () => setTool('eraser'));

  // ── Channel buttons ───────────────────────────────────────
  chSwatches.forEach(btn => {
    btn.addEventListener('click', () => {
      chSwatches.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeChannel = btn.dataset.ch;
      if (activeTool === 'eraser') setTool('round');
    });
  });

  // ── Waveform cycle ────────────────────────────────────────
  btnWave.addEventListener('click', () => {
    waveIdx = (waveIdx + 1) % WAVEFORMS.length;
    const w = WAVEFORMS[waveIdx];
    btnWave.textContent  = 'wave: ' + WAVE_LABELS[waveIdx];
    waveformLabel.textContent = w;
    if (osc1) osc1.type = w;
    if (osc2) osc2.type = w;
    showStatus('waveform: ' + w);
  });

  // ── Sliders ───────────────────────────────────────────────
  tempoSlider.addEventListener('input', () => {
    loopSecs = parseInt(tempoSlider.value);
    tempoVal.textContent = loopSecs + 's';
  });
  sizeSlider.addEventListener('input', () => {
    penSize = parseInt(sizeSlider.value);
    sizeVal.textContent = penSize;
  });
  mixSlider.addEventListener('input', () => {
    voice2Mix = parseInt(mixSlider.value) / 100;
    mixVal.textContent = mixSlider.value + '%';
    if (gain2) gain2.gain.setTargetAtTime(voice2Mix * 0.35, audioCtx.currentTime, 0.05);
  });

  // ── Presets ───────────────────────────────────────────────
  document.querySelectorAll('[data-preset]').forEach(btn => {
    btn.addEventListener('click', () => {
      saveUndo();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawPreset(btn.dataset.preset);
      showStatus('preset: ' + btn.dataset.preset);
    });
  });

  function drawPreset(name) {
    const W = canvas.width, H = canvas.height;
    ctx.save();
    ctx.lineCap  = 'round';
    ctx.lineJoin = 'round';

    if (name === 'rise') {
      // Pitch 1: rises from low-mid to high with gentle wobble
      ctx.strokeStyle = CHANNELS.pitch;
      ctx.lineWidth   = 10;
      ctx.beginPath();
      for (let i = 0; i <= 80; i++) {
        const t  = i / 80;
        const y  = H * (0.75 - t * 0.58 + Math.sin(t * Math.PI * 5) * 0.03);
        if (i === 0) ctx.moveTo(W * 0.04, y); else ctx.lineTo(W * (0.04 + t * 0.92), y);
      }
      ctx.stroke();
      // Amp: swell in and out
      ctx.strokeStyle = CHANNELS.amp;
      ctx.lineWidth   = 8;
      ctx.beginPath();
      for (let i = 0; i <= 60; i++) {
        const t = i / 60;
        const y = H * (1 - Math.sin(t * Math.PI) * 0.78);
        if (i === 0) ctx.moveTo(W * 0.04, y); else ctx.lineTo(W * (0.04 + t * 0.92), y);
      }
      ctx.stroke();

    } else if (name === 'wave') {
      // Pitch 1: slow sine wave
      ctx.strokeStyle = CHANNELS.pitch;
      ctx.lineWidth   = 10;
      ctx.beginPath();
      for (let i = 0; i <= 100; i++) {
        const t = i / 100;
        const y = H * (0.5 + Math.sin(t * Math.PI * 2) * 0.3);
        if (i === 0) ctx.moveTo(W * t, y); else ctx.lineTo(W * t, y);
      }
      ctx.stroke();
      // Pitch 2: offset wave, slightly tighter amplitude
      ctx.strokeStyle = CHANNELS.pitch2;
      ctx.lineWidth   = 8;
      ctx.beginPath();
      for (let i = 0; i <= 100; i++) {
        const t = i / 100;
        const y = H * (0.5 + Math.sin(t * Math.PI * 2 + 0.9) * 0.21);
        if (i === 0) ctx.moveTo(W * t, y); else ctx.lineTo(W * t, y);
      }
      ctx.stroke();
      // Timbre: opens at wave crest
      ctx.strokeStyle = CHANNELS.timbre;
      ctx.lineWidth   = 7;
      ctx.beginPath();
      for (let i = 0; i <= 100; i++) {
        const t = i / 100;
        const y = H * (0.32 + Math.sin(t * Math.PI * 2 + Math.PI) * 0.22);
        if (i === 0) ctx.moveTo(W * t, y); else ctx.lineTo(W * t, y);
      }
      ctx.stroke();

    } else if (name === 'rhythm') {
      // Three amplitude bursts
      ctx.strokeStyle = CHANNELS.amp;
      ctx.lineWidth   = 13;
      [[0.08, 0.28],[0.38, 0.58],[0.65, 0.88]].forEach(([s, e]) => {
        const mid = (s + e) / 2;
        ctx.beginPath();
        ctx.moveTo(W * s,   H * 0.18);
        ctx.lineTo(W * mid, H * 0.10);
        ctx.lineTo(W * e,   H * 0.18);
        ctx.stroke();
      });
      // Fixed mid pitch
      ctx.strokeStyle = CHANNELS.pitch;
      ctx.lineWidth   = 9;
      ctx.beginPath();
      ctx.moveTo(W * 0.04, H * 0.44);
      ctx.lineTo(W * 0.96, H * 0.44);
      ctx.stroke();
      // Light vibrato throughout
      ctx.strokeStyle = CHANNELS.mod;
      ctx.lineWidth   = 7;
      ctx.beginPath();
      for (let i = 0; i <= 80; i++) {
        const t = i / 80;
        const y = H * (0.74 + Math.sin(t * Math.PI * 9) * 0.07);
        if (i === 0) ctx.moveTo(W * t, y); else ctx.lineTo(W * t, y);
      }
      ctx.stroke();

    } else if (name === 'drone') {
      // Low steady pitch
      ctx.strokeStyle = CHANNELS.pitch;
      ctx.lineWidth   = 11;
      ctx.beginPath();
      ctx.moveTo(W * 0.02, H * 0.68);
      ctx.lineTo(W * 0.98, H * 0.68);
      ctx.stroke();
      // Slow deep modulation
      ctx.strokeStyle = CHANNELS.mod;
      ctx.lineWidth   = 9;
      ctx.beginPath();
      for (let i = 0; i <= 80; i++) {
        const t = i / 80;
        const y = H * (0.28 + Math.sin(t * Math.PI * 1.5) * 0.19);
        if (i === 0) ctx.moveTo(W * t, y); else ctx.lineTo(W * t, y);
      }
      ctx.stroke();
      // Timbre gradually opens
      ctx.strokeStyle = CHANNELS.timbre;
      ctx.lineWidth   = 8;
      ctx.beginPath();
      for (let i = 0; i <= 60; i++) {
        const t = i / 60;
        const y = H * (0.88 - t * 0.68);
        if (i === 0) ctx.moveTo(W * t, y); else ctx.lineTo(W * t, y);
      }
      ctx.stroke();
    }

    ctx.restore();
  }

  // ── Audio engine ──────────────────────────────────────────
  let audioCtx  = null;
  let osc1, osc2, gain1, gain2, masterGain;
  let lfo, lfoGain;
  let filter1, filter2;
  let animFrame = null;
  let startTime = 0;

  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    masterGain = audioCtx.createGain();
    masterGain.gain.value = 1;
    masterGain.connect(audioCtx.destination);

    // Shared LFO for vibrato
    lfo     = audioCtx.createOscillator();
    lfoGain = audioCtx.createGain();
    lfo.type = 'sine';
    lfo.frequency.value = 0;
    lfoGain.gain.value  = 0;
    lfo.connect(lfoGain);

    // Voice 1
    osc1    = audioCtx.createOscillator();
    filter1 = audioCtx.createBiquadFilter();
    gain1   = audioCtx.createGain();
    osc1.type = WAVEFORMS[waveIdx];
    osc1.frequency.value = 220;
    filter1.type = 'lowpass';
    filter1.frequency.value = 1200;
    filter1.Q.value = 0.8;
    gain1.gain.value = 0;
    lfoGain.connect(osc1.frequency);
    osc1.connect(filter1);
    filter1.connect(gain1);
    gain1.connect(masterGain);
    osc1.start();

    // Voice 2 — slight detune for natural width
    osc2    = audioCtx.createOscillator();
    filter2 = audioCtx.createBiquadFilter();
    gain2   = audioCtx.createGain();
    osc2.type = WAVEFORMS[waveIdx];
    osc2.frequency.value = 220;
    osc2.detune.value = 7;
    filter2.type = 'lowpass';
    filter2.frequency.value = 1200;
    filter2.Q.value = 0.8;
    gain2.gain.value = 0;
    lfoGain.connect(osc2.frequency);
    osc2.connect(filter2);
    filter2.connect(gain2);
    gain2.connect(masterGain);
    osc2.start();
  }

  // ── Column sampler ────────────────────────────────────────
  function sampleColumn(progress) {
    const W = canvas.width, H = canvas.height;
    const mobile = isMobile();

    let colData;
    if (mobile) {
      const row = Math.min(H - 1, Math.floor(progress * H));
      colData = ctx.getImageData(0, row, W, 1).data;
    } else {
      const col = Math.min(W - 1, Math.floor(progress * W));
      colData = ctx.getImageData(col, 0, 1, H).data;
    }

    const size   = mobile ? W : H;
    const result = {};

    for (const [ch, [r, g, b]] of Object.entries(CH_RGB)) {
      let bestVal = null, bestMatch = 0;
      for (let p = 0; p < size; p++) {
        const base  = p * 4;
        const alpha = colData[base + 3] / 255;
        if (alpha < 0.15) continue;
        const dr = colData[base]     - r;
        const dg = colData[base + 1] - g;
        const db = colData[base + 2] - b;
        const dist  = Math.sqrt(dr*dr + dg*dg + db*db);
        const match = alpha * (1 - dist / 441.7);
        if (match > bestMatch) {
          bestMatch = match;
          const norm = p / size;
          bestVal = mobile ? norm : (1 - norm);
        }
      }
      result[ch] = (bestMatch > 0.08) ? bestVal : null;
    }
    return result;
  }

  // ── Audio/animation loop ──────────────────────────────────
  function audioLoop() {
    if (!isPlaying) return;

    const now      = audioCtx.currentTime;
    const elapsed  = (now - startTime) % loopSecs;
    const progress = elapsed / loopSecs;
    const t        = now + 0.02;

    const W = canvas.width, H = canvas.height;

    // Move scan line
    if (isMobile()) {
      scanLine.style.top  = (progress * H) + 'px';
    } else {
      scanLine.style.left = (progress * W) + 'px';
    }

    const vals = sampleColumn(progress);

    // ── Voice 1 ───────────────────────────────────────────
    if (vals.pitch !== null) {
      const freq1 = 110 * Math.pow(8, vals.pitch);
      osc1.frequency.setTargetAtTime(freq1, t, 0.04);
      gain1.gain.setTargetAtTime(0.38, t, 0.04);
      statusNote.textContent = freqToNote(freq1);
      statusNote.classList.add('visible');
    } else {
      gain1.gain.setTargetAtTime(0, t, 0.08);
      statusNote.classList.remove('visible');
    }

    // ── Voice 2 ───────────────────────────────────────────
    if (vals.pitch2 !== null) {
      const freq2 = 110 * Math.pow(8, vals.pitch2);
      osc2.frequency.setTargetAtTime(freq2, t, 0.04);
      gain2.gain.setTargetAtTime(voice2Mix * 0.35, t, 0.04);
    } else {
      gain2.gain.setTargetAtTime(0, t, 0.08);
    }

    // ── Amplitude (overrides default gain when drawn) ─────
    if (vals.amp !== null) {
      gain1.gain.setTargetAtTime(vals.amp * 0.55, t, 0.03);
      if (vals.pitch2 !== null) {
        gain2.gain.setTargetAtTime(vals.amp * voice2Mix * 0.35, t, 0.03);
      }
    }

    // ── Modulation ────────────────────────────────────────
    const modVal = vals.mod !== null ? vals.mod : 0;
    lfo.frequency.setTargetAtTime(modVal * 7,  t, 0.05);
    lfoGain.gain.setTargetAtTime (modVal * 14, t, 0.05);

    // ── Timbre ────────────────────────────────────────────
    const timbreVal = vals.timbre !== null ? vals.timbre : 0.65;
    const cutoff = 180 * Math.pow(45, timbreVal);
    filter1.frequency.setTargetAtTime(cutoff, t, 0.04);
    filter2.frequency.setTargetAtTime(cutoff, t, 0.04);

    animFrame = requestAnimationFrame(audioLoop);
  }

  // ── Scan line orientation ─────────────────────────────────
  function updateScanOrientation() {
    if (!isPlaying) return;
    if (isMobile()) {
      scanLine.style.cssText += ';width:100%;height:2px;left:0;bottom:auto;';
    } else {
      scanLine.style.cssText += ';width:2px;height:100%;top:0;bottom:0;';
    }
  }

  // ── Play / Stop ───────────────────────────────────────────
  btnPlay.addEventListener('click', () => {
    if (isPlaying) {
      isPlaying = false;
      cancelAnimationFrame(animFrame);
      animFrame = null;

      const now = audioCtx.currentTime;
      gain1.gain.cancelScheduledValues(now);
      gain1.gain.setTargetAtTime(0, now, 0.05);
      gain2.gain.cancelScheduledValues(now);
      gain2.gain.setTargetAtTime(0, now, 0.05);
      lfoGain.gain.cancelScheduledValues(now);
      lfoGain.gain.setTargetAtTime(0, now, 0.05);
      setTimeout(() => { if (!isPlaying && audioCtx) audioCtx.suspend(); }, 300);

      scanLine.style.display = 'none';
      btnPlay.textContent = '▶\uFE0E play';
      btnPlay.classList.remove('active');
      statusNote.classList.remove('visible');

    } else {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      isPlaying = true;
      startTime = audioCtx.currentTime;

      scanLine.style.display = 'block';
      updateScanOrientation();
      btnPlay.textContent = '■\uFE0E stop';
      btnPlay.classList.add('active');
      audioLoop();
    }
  });

  window.addEventListener('resize', () => {
    resizeCanvas();
    updateScanOrientation();
  });

})();
</script>

</body>
</html>
