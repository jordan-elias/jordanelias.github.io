<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Page not found – Jordan Elias</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Site Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <style>
    /* Background & layout consistent with site */
    body {
      font-family: 'Lato', sans-serif;
      background: linear-gradient(135deg, #ff00ff, #00ffff);
      color: #ffffff;
      margin: 0;
      padding: 0;
      line-height: 1.6;
      text-shadow: 1px 1px #ff00ff, -1px -1px #00ffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    main {
      max-width: 600px;
      padding: 2em;
      background-color: rgba(0,0,0,0.6);
      border: 2px dashed #ff00ff;
      transform: skewX(-2deg);
    }

    h1 {
      font-family: 'VT323', monospace;
      font-size: 2.5rem;
      margin-bottom: 1em;
      text-shadow: 2px 0 #ff00ff, -2px 0 #00ffff;
    }

    p {
      margin-bottom: 1em;
    }

    a {
      color: #ff00ff;
      font-weight: bold;
      text-decoration: underline;
    }

    /* Responsive adjustments */
    @media (max-width: 800px) {
      main {
        transform: skewX(0deg);
        padding: 1.5em;
      }
      h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>404 Page not found</h1>
    <p>The page you’re looking for has moved or does not exist.</p>
    <p><a href="/">Return to the main page</a></p>
  </main>
</body>
</html>
